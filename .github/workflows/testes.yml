name: Testes do jogo
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: astronautas_teste
          POSTGRES_USER: astronautas
          POSTGRES_PASSWORD: teste-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astronautas -d astronautas_teste"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ASTRO_TEST_DATABASE_URL: postgresql://astronautas:teste-ci@127.0.0.1:5432/astronautas_teste
      ASTRO_CEREBRO: r1
      OPENBLAS_NUM_THREADS: 1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt -r requirements-neural.txt
      - run: python -m unittest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
